# Configuración del Servidor
server.port=8080

# Configuración de Conexión a Base de Datos (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextlead}
spring.datasource.username=postgres
spring.datasource.password=nextlead_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de Base de Datos (ejecutar schema.sql en Postgres)
spring.sql.init.mode=always

# Configuración JWT (Semilla inyectada por variable de entorno y Expiración en ms - 24h)
jwt.secret=${JWT_SECRET:nextlead_super_secure_jwt_secret_token_default_key_2026_dev}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Meta WhatsApp Cloud API Configurations
# Token de Acceso Permanente (System User Token) de Meta inyectado por entorno:
whatsapp.api.token=${WHATSAPP_API_TOKEN:}
# Identificador de tu número de teléfono (Phone Number ID) inyectado por entorno:
whatsapp.phone.id=${WHATSAPP_PHONE_ID:}
# Token de verificación para el registro del Webhook en la consola de Meta:
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN:nextlead_verify_token}
# Número de teléfono para identificar quién envía (opcional)
whatsapp.display.number=${WHATSAPP_DISPLAY_NUMBER:}

# Google Gemini API Configurations
# API Key de Google Gemini inyectada por entorno:
gemini.api.key=${GEMINI_API_KEY:}

# Configuración de límites de carga de archivos (soporte para imágenes de mayor tamaño)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Configuración de logs en archivo para visualización en el Frontend
logging.file.name=logs/nextlead.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Habilitar Actuator para verificación de estado
management.endpoints.web.exposure.include=health,info

# Jackson Configuration
spring.jackson.parser.allow-unquoted-control-chars=true




